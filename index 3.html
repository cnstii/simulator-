<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#193747"><title>SECOND CHANCE TYCOON</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#193747;color:#fff;font:14px system-ui;touch-action:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:absolute;top:8px;left:8px;max-width:95vw;background:#142d3fe8;border:2px solid #7fe2c6;border-radius:10px;padding:8px;font-weight:bold;font-size:12px}#joy{position:absolute;left:18px;bottom:18px;width:112px;height:112px;border-radius:50%;border:3px solid #ffffff99;background:#b5ffdd25}#nub{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#a5ffe3;border:2px solid white}#controls{position:absolute;bottom:14px;right:12px;display:grid;gap:8px}button{border:2px solid #fff2b0;border-radius:12px;background:#f4c46c;color:#243743;padding:12px;font-weight:900;touch-action:manipulation}#menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(90vw,450px);max-height:78dvh;overflow:auto;background:#153748f5;border:3px solid #89e4c8;border-radius:16px;padding:16px;display:none}#menu button{display:block;width:100%;margin:7px 0}#message{position:absolute;left:50%;top:25%;transform:translateX(-50%);background:#173747ee;padding:10px 16px;border-radius:9px;display:none;text-align:center;max-width:80vw}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="joy"><div id="nub"></div></div><div id="controls"><button id="action">⚡ AKTION</button><button id="build">🏗 BAUEN</button><button id="save">💾 SAVE</button></div><div id="menu"></div><div id="message"></div><script>
(()=>{'use strict';const $=q=>document.querySelector(q),canvas=$('#game'),ctx=canvas.getContext('2d');const initial=()=>({money:50,x:10,y:11,carried:null,metal:0,plastic:0,parts:0,products:0,repairedValue:0,garage:1,employees:0,crusher:false,assembler:false,belt:false,totalSales:0});let state;try{state={...initial(),...JSON.parse(localStorage.getItem('second-chance-tycoon-save')||'{}')}}catch{state=initial()}const goods=[{name:'Radio',cost:12,value:30},{name:'Toaster',cost:18,value:43},{name:'Ventilator',cost:25,value:60}],stations=[{id:'market',x:4,y:5,name:'SCHROTTMARKT',color:'#eda45d'},{id:'bench',x:11,y:8,name:'WERKBANK',color:'#e5bf75'},{id:'crusher',x:15,y:8,name:'ZERLEGER',color:'#a1b8f0'},{id:'assembler',x:19,y:8,name:'MONTAGE',color:'#bba4ed'},{id:'shop',x:22,y:5,name:'VERKAUF',color:'#a3e4b0'},{id:'office',x:21,y:15,name:'BÜRO',color:'#efafd3'}];const save=()=>localStorage.setItem('second-chance-tycoon-save',JSON.stringify(state));function notify(t){$('#message').textContent=t;$('#message').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#message').style.display='none',2300)}function spend(n){if(state.money<n){notify('Nicht genug Geld!');return false}state.money-=n;return true}function showMenu(title,options){const m=$('#menu');m.replaceChildren();const h=document.createElement('h2');h.textContent=title;m.append(h);for(const [label,fn] of options){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();save();m.style.display='none'};m.append(b)}const close=document.createElement('button');close.textContent='Schließen';close.onclick=()=>m.style.display='none';m.append(close);m.style.display='block'}function build(){showMenu('🏗 Ausbau & Automatisierung',[['Zerleger kaufen · 90 €'+(state.crusher?' ✓':''),()=>{if(!state.crusher&&spend(90))state.crusher=true}],['Montagemaschine · 140 €'+(state.assembler?' ✓':''),()=>{if(!state.assembler&&spend(140))state.assembler=true}],['Förderband · 75 €'+(state.belt?' ✓':''),()=>{if(!state.belt&&spend(75))state.belt=true}],['Mitarbeiter einstellen · 180 €',()=>{if(spend(180))state.employees++}],['Garage erweitern · '+state.garage*150+' €',()=>{if(spend(state.garage*150))state.garage++}]])}function interact(){const near=stations.filter(o=>Math.hypot(o.x-state.x,o.y-state.y)<2.2).sort((a,b)=>Math.hypot(a.x-state.x,a.y-state.y)-Math.hypot(b.x-state.x,b.y-state.y))[0];if(!near){notify('Gehe zu einer Station');return}switch(near.id){case 'market':showMenu('🛒 Schrottmarkt',goods.map((it,i)=>[it.name+' kaufen · '+it.cost+' €',()=>{if(state.carried!==null)return notify('Du trägst schon einen Gegenstand');if(spend(it.cost)){state.carried=i;notify('Gerät gekauft und aufgenommen')}}]));break;case 'bench':showMenu('🔧 Werkbank',[['Gerät reparieren · 4 €',()=>{if(state.carried===null)return notify('Kein Gerät getragen');if(spend(4)){state.repairedValue+=goods[state.carried].value;state.carried=null;notify('Gerät repariert!')}}]]);break;case 'crusher':if(!state.crusher)return notify('Zerleger zuerst kaufen');showMenu('⚙️ Zerleger',[['Getragenes Gerät zerlegen',()=>{if(state.carried===null)return notify('Kein Gerät getragen');state.metal+=state.carried+2;state.plastic+=2;state.parts++;state.carried=null;notify('Rohstoffe gewonnen!')}]]);break;case 'assembler':if(!state.assembler)return notify('Montage zuerst kaufen');showMenu('🏭 Montage',[['Produkt herstellen: 2 Metall, 2 Plastik, 1 Teil',()=>{if(state.metal<2||state.plastic<2||state.parts<1)return notify('Nicht genug Rohstoffe');state.metal-=2;state.plastic-=2;state.parts--;state.products++;notify('Produkt hergestellt!')}]]);break;case 'shop':showMenu('💶 Kundenverkauf',[['Reparierte Geräte verkaufen · '+state.repairedValue+' €',()=>{state.money+=state.repairedValue;state.totalSales+=state.repairedValue;state.repairedValue=0}],['Produkte verkaufen · '+state.products*65+' €',()=>{const v=state.products*65;state.money+=v;state.totalSales+=v;state.products=0}]]);break;case 'office':build();break}}$('#action').onclick=interact;$('#build').onclick=build;$('#save').onclick=()=>{save();notify('Spielstand gespeichert!')};const keys={},joy={x:0,y:0};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='b')build();if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const stick=$('#joy'),nub=$('#nub');let pointer=null;function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,len/40);joy.x=dx/len*f;joy.y=dy/len*f;nub.style.transform='translate('+joy.x*34+'px,'+joy.y*34+'px)'}stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===pointer)moveStick(e)};function stop(e){if(e.pointerId!==pointer)return;pointer=null;joy.x=joy.y=0;nub.style.transform=''}stick.onpointerup=stop;stick.onpointercancel=stop;function iso(x,y){return{x:(x-y)*32,y:(x+y)*16}}function diamond(x,y,color){ctx.beginPath();ctx.moveTo(x,y-16);ctx.lineTo(x+32,y);ctx.lineTo(x,y+16);ctx.lineTo(x-32,y);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#4f8b74';ctx.lineWidth=1;ctx.stroke()}function render(t){const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#83cbd0';ctx.fillRect(0,0,w,h);const center=iso(state.x,state.y);ctx.save();ctx.translate(w/2-center.x,h/2-center.y);for(let y=0;y<27;y++)for(let x=0;x<27;x++){const p=iso(x,y);diamond(p.x,p.y,x>7&&x<25&&y>5&&y<20?'#b6b7a5':(x+y)%2?'#77bc8b':'#85c997')}for(const o of stations){const p=iso(o.x,o.y),locked=o.id==='crusher'&&!state.crusher||o.id==='assembler'&&!state.assembler;ctx.fillStyle='#315568';ctx.fillRect(p.x-22,p.y-20,44,25);ctx.fillStyle=locked?'#7b8590':o.color;ctx.fillRect(p.x-22,p.y-35,44,17);ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.strokeStyle='#15313c';ctx.lineWidth=3;ctx.strokeText(o.name,p.x,p.y-42);ctx.fillStyle='#fff7c5';ctx.fillText(o.name,p.x,p.y-42)}if(state.belt)for(let i=0;i<4;i++){const p=iso(12+i,12);diamond(p.x,p.y,i%2?'#e4c567':'#c2a14b')}const p=iso(state.x,state.y),bob=Math.sin(t/115)*1.8;ctx.fillStyle='#2b4b85';ctx.fillRect(p.x-8,p.y-8+bob,16,22);ctx.fillStyle='#ffd6a7';ctx.fillRect(p.x-7,p.y-22+bob,14,14);ctx.fillStyle='#61443b';ctx.fillRect(p.x-8,p.y-25+bob,16,5);if(state.carried!==null){ctx.fillStyle='#ffc15b';ctx.fillRect(p.x+9,p.y-25,15,13)}ctx.restore();$('#hud').textContent='SECOND CHANCE TYCOON  |  💶 '+state.money+' €  |  🔩 '+state.metal+' Metall · '+state.plastic+' Plastik · '+state.parts+' Teile  |  📦 '+state.products+' Produkte  |  🏠 Stufe '+state.garage+' · 👷 '+state.employees}let last=performance.now(),auto=0;function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy);if(len>.1&&$('#menu').style.display!=='block'){dx/=Math.max(1,len);dy/=Math.max(1,len);state.x=Math.max(1,Math.min(25,state.x+(dx+dy)*dt*3));state.y=Math.max(1,Math.min(25,state.y+(dy-dx)*dt*3))}auto+=dt;if(auto>=8){auto=0;if(state.employees&&state.crusher&&state.assembler){state.products+=state.employees;save()}}render(t);requestAnimationFrame(loop)}document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});requestAnimationFrame(loop)})();
</script></body></html>
