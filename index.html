<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SECOND CHANCE TYCOON</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#172423;color:#f6edcf;font:700 15px system-ui}#status{padding:18px 24px;border:2px solid #c8e77b;background:#20352d}</style>
</head>
<body><p id="status">SECOND CHANCE TYCOON wird geladen …</p>
<script>
(async()=>{try{
  const response=await fetch('https://raw.githubusercontent.com/cnstii/simulator-/2c5552bf430851dd857aac2edd934cb47a064652/index.html');
  if(!response.ok)throw Error('Spielquelle konnte nicht geladen werden.');
  const source=await response.text();
  const match=source.match(/const payload="([^"]+)"/);
  if(!match)throw Error('Spielquelle ist unvollständig.');
  const encoded=match[1].replace(/\s/g,'').replace('FM3qJZn4Yp4Nvyw','FM3qZJn4Yp4Nvyw');
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
}catch(error){document.getElementById('status').textContent=error.message+' Bitte öffne die Spielversion über die README oder lade sie erneut.'}})();
</script></body></html>
